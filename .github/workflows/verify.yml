name: Проверка невозможного

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # exhibit V needs the whole history
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node verify.mjs
